name: citizen_app
description: "SamadhanAI Citizen Mobile Application"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  cupertino_icons: ^1.0.8
  dio: ^5.10.0
  firebase_auth: ^5.7.0
  firebase_core: ^3.12.0
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.1
  flutter_secure_storage: ^11.2.0
  flutter_riverpod: ^3.3.2
  freezed_annotation: ^3.1.0
  go_router: ^17.3.0
