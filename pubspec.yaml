  image_picker: ^1.2.3
  json_annotation: ^4.12.0
  path_provider: ^2.1.2
  shared_preferences: ^2.5.5

dev_dependencies:
  build_runner: ^2.15.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
